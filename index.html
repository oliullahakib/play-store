<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Store</title>
    <link rel="stylesheet" href="./styles/playstore.css">
    <!-- google sans font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <!-- font awsome cdn  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
        integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="google-sans-code-font">
    <header>
        <nav>
            <div class="logo">
                <img src="./images/google-play-store.png" alt="">
                <ul class="links">
                    <li class="link"><a href="https://play.google.com/store/games?hl=en" target="_blank">Game</a>
                    </li>
                    <li class="link"><a href="https://play.google.com/store/apps?hl=en" target="_blank">Apps</a>
                    </li>
                    <li class="link"><a href="https://play.google.com/store/apps/category/FAMILY?hl=en"
                            target="_blank">Kids</a>
                    </li>
                </ul>
            </div>
            <div class="search">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        </nav>
    </header>
    <main>
        <section class="recommended">
            <h3 class="section-title">Recommended For Your</h3>
            <div class="cards-container">
                <!-- free fire -->
                <a href="https://play.google.com/store/apps/details?id=com.dts.freefireth&hl=en">
                    <div class="card">
                        <img src="./images/squde-game.webp" alt="free-fire-thumbnail">
                        <div class="card-content">
                            <img src="./images/free-fire-thumbnail.webp" alt="free fire logo">
                            <div class="card-content-details">
                                <h5>Free Fire: 8th Anniversary!</h5>
                                <span>Action</span>
                                <span>Tactical Shooter</span>
                            </div>

                        </div>
                        <div class="rating">
                            <p>4.4 <i class="fa-solid fa-star"></i></p>
                        </div>
                    </div>
                </a>
                <!-- pubg -->
                <a href="https://play.google.com/store/apps/details?id=com.tencent.ig&hl=en">
                    <div class="card">
                        <img src="./images/pubg.jpeg" alt="pubg">
                        <div class="card-content">
                            <img src="./images/pubg-logo.jpeg" alt="free fire logo">
                            <div class="card-content-details">
                                <h5>Free Fire: 8th Anniversary!</h5>
                                <span>Action</span>
                                <span>Tactical Shooter</span>
                            </div>

                        </div>
                        <div class="rating">
                            <p>4.4 <i class="fa-solid fa-star"></i></p>
                        </div>
                    </div>
                </a>
                <!-- cod -->
                <a href="https://play.google.com/store/apps/details?id=com.activision.callofduty.shooter&hl=en">
                    <div class="card">
                        <img src="./images/cod.jpeg" alt="cod-thumbnail">
                        <div class="card-content">
                            <img src="./images/cod-logo.jpeg" alt="free fire logo">
                            <div class="card-content-details">
                                <h5>Call of Duty: Mobile Season 6</h5>
                                <span>Action</span>
                                <span>Tactical Shooter</span>
                            </div>

                        </div>
                        <div class="rating">
                            <p>4.3 <i class="fa-solid fa-star"></i></p>
                        </div>
                    </div>
                </a>
            </div>
            </div>
        </section>
    </main>
</body>

</html>
